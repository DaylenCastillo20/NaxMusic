<link rel="stylesheet" href="css/gestion_cotizaciones.css">

<section class="gc-container" id="misCotizacionesPanel">
    <header class="gc-header">
        <div class="gc-header-left">
            <div class="gc-title-group">
                <h1>Mis Cotizaciones</h1>
                <p>Revisa el historial y estado de tus cotizaciones realizadas.</p>
            </div>
        </div>
    </header>

    <main class="gc-main">
        <div class="gc-table-shell">
            <div class="gc-table-toolbar">
                <div>
                    <h2>Historial de Cotizaciones</h2>
                    <p id="mcTableDescription">Cotizaciones asociadas a tu cuenta.</p>
                </div>
                <div class="gc-toolbar-actions">
                    <button class="gc-add-service bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl transition-all flex items-center gap-2" type="button" id="mcNuevaCotizacion">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 5v14"></path>
                            <path d="M5 12h14"></path>
                        </svg>
                        Nueva Cotización
                    </button>
                    <div class="gc-toolbar-status" id="mcStatus" aria-live="polite"></div>
                </div>
            </div>

            <div class="gc-table-container">
                <table class="gc-table" aria-describedby="mcTableDescription">
                    <thead id="mcTableHead"></thead>
                    <tbody id="mcTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para ver detalle de cotización -->
    <div class="gc-modal" id="mcModal" aria-hidden="true">
        <div class="gc-modal-backdrop" data-mc-modal-close></div>
        <div class="gc-modal-card" role="dialog" aria-modal="true" aria-labelledby="mcModalTitle">
            <button class="gc-modal-close" type="button" data-mc-modal-close aria-label="Cerrar modal">x</button>
            <div id="mcModalContent"></div>
        </div>
    </div>
</section>

<script src="js/mis_cotizaciones.js"></script>
