<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - NaxMusic</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/login.css">

</head>

<body class="body-auth login-bg">

    <div id="header-container"></div>

    <main class="auth-screen">
        <div class="contenedor contenedor-registro auth-card">
            <img src="../img/logo.jpeg" alt="Logo NaxMusic" class="logo-registro">
            <p class="auth-eyebrow">Cliente nuevo</p>
            <h2>Crear cuenta</h2>
            <p class="subtexto">Únete a <span>NaxMusic</span> y comienza a cotizar tus servicios</p>

            <form id="registroForm">
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" pattern="[0-9]+"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    <button type="button" class="password-toggle" data-password-toggle="password"
                        aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12Z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3l18 18M10.73 5.08A10.9 10.9 0 0 1 12 5.25c6 0 9.75 6.75 9.75 6.75a18.6 18.6 0 0 1-2.04 2.72M6.61 6.61C3.88 8.45 2.25 12 2.25 12s3.75 6.75 9.75 6.75a10.8 10.8 0 0 0 4.03-.78M9.88 9.88A3 3 0 0 0 14.12 14.12" />
                        </svg>
                    </button>
                </div>
                <div class="password-field">
                    <input type="password" id="confirmar" name="confirmar" placeholder="Confirmar contraseña" required>
                    <button type="button" class="password-toggle" data-password-toggle="confirmar"
                        aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12Z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3l18 18M10.73 5.08A10.9 10.9 0 0 1 12 5.25c6 0 9.75 6.75 9.75 6.75a18.6 18.6 0 0 1-2.04 2.72M6.61 6.61C3.88 8.45 2.25 12 2.25 12s3.75 6.75 9.75 6.75a10.8 10.8 0 0 0 4.03-.78M9.88 9.88A3 3 0 0 0 14.12 14.12" />
                        </svg>
                    </button>
                </div>

                <button type="submit">Registrarse</button>
            </form>

            <div class="linea"></div>
            <p class="texto-login">
                ¿Ya tienes cuenta? <a href="login.html" onclick="if (typeof cargarContenido === 'function') { cargarContenido('login'); return false; }">Inicia sesión</a>
            </p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.js"></script>
    <script type="module">
        import { supabase } from '../config/DatabaseConfig.js';

        document.querySelectorAll('[data-password-toggle]').forEach((button) => {
            if (button.dataset.bound === 'true') return;
            button.dataset.bound = 'true';

            const input = document.getElementById(button.dataset.passwordToggle);
            if (!input) return;

            const showPassword = () => {
                input.type = 'text';
                button.classList.add('is-visible');
                button.setAttribute('aria-label', 'Ocultar contraseña');
                button.setAttribute('aria-pressed', 'true');
            };

            const hidePassword = () => {
                input.type = 'password';
                button.classList.remove('is-visible');
                button.setAttribute('aria-label', 'Mostrar contraseña');
                button.setAttribute('aria-pressed', 'false');
            };

            button.addEventListener('mousedown', showPassword);
            button.addEventListener('mouseup', hidePassword);
            button.addEventListener('mouseleave', hidePassword);
            button.addEventListener('touchstart', showPassword, { passive: true });
            button.addEventListener('touchend', hidePassword, { passive: true });
        });

        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmar = document.getElementById('confirmar').value;

            // Validación exacta de contraseñas de tu controlador
            if (password !== confirmar) {
                if (typeof window.mostrarError === 'function') {
                    window.mostrarError("Las contraseñas no coinciden.");
                } else {
                    alert("Las contraseñas no coinciden.");
                }
                return;
            }

            // Encriptar con bcryptjs
            const salt = dcodeIO.bcrypt.genSaltSync(10);
            const passwordHash = dcodeIO.bcrypt.hashSync(password, salt);

            // Registro en la tabla 'usuarios' directamente
            const { data, error } = await supabase
                .from('usuarios')
                .insert([
                    {
                        nombre: nombre,
                        telefono: telefono,
                        email: email,
                        password: passwordHash,
                        tipo_usuario: 'Cliente'
                    }
                ]);

            if (error) {
                if (typeof window.mostrarError === 'function') {
                    window.mostrarError('Error al registrar usuario: ' + error.message);
                } else {
                    alert('Error al registrar usuario: ' + error.message);
                }
            } else {
                if (typeof window.cargarContenido === 'function') {
                    window.cargarContenido('login');
                } else {
                    window.location.href = "login.html?login=1";
                }
            }
        });
    </script>
</body>

</html>
