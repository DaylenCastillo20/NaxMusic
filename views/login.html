<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NaxMusic</title>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body class="body-auth login-bg">

    <div id="header-container"></div>

    <main class="auth-screen">
        <div class="contenedor contenedor-registro auth-card">
            <img src="../img/logo.jpeg" class="logo-registro" alt="Logo NaxMusic">
            <p class="auth-eyebrow">Acceso cliente</p>
            <h2>Iniciar Sesión</h2>
            <p class="subtexto">Bienvenido de nuevo a <span>NAXMUSIC</span></p>

            <form id="loginForm">
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="password-toggle" data-password-toggle="password"
                        aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12s-3.75 6.75-9.75 6.75S2.25 12 2.25 12Z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="2" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 3l18 18M10.73 5.08A10.9 10.9 0 0 1 12 5.25c6 0 9.75 6.75 9.75 6.75a18.6 18.6 0 0 1-2.04 2.72M6.61 6.61C3.88 8.45 2.25 12 2.25 12s3.75 6.75 9.75 6.75a10.8 10.8 0 0 0 4.03-.78M9.88 9.88A3 3 0 0 0 14.12 14.12" />
                        </svg>
                    </button>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>

            <div class="linea"></div>
            <p class="texto-login">
                ¿No tienes cuenta? <a href="registro.html" onclick="if (typeof cargarContenido === 'function') { cargarContenido('registro'); return false; }">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.js"></script>
    <script type="module">
        import { supabase } from '../config/DatabaseConfig.js';

        document.querySelectorAll('[data-password-toggle]').forEach((button) => {
            if (button.dataset.bound === 'true') return;
            button.dataset.bound = 'true';

            const input = document.getElementById(button.dataset.passwordToggle);
            if (!input) return;

            const showPassword = () => {
                input.type = 'text';
                button.classList.add('is-visible');
                button.setAttribute('aria-label', 'Ocultar contraseña');
                button.setAttribute('aria-pressed', 'true');
            };

            const hidePassword = () => {
                input.type = 'password';
                button.classList.remove('is-visible');
                button.setAttribute('aria-label', 'Mostrar contraseña');
                button.setAttribute('aria-pressed', 'false');
            };

            button.addEventListener('mousedown', showPassword);
            button.addEventListener('mouseup', hidePassword);
            button.addEventListener('mouseleave', hidePassword);
            button.addEventListener('touchstart', showPassword, { passive: true });
            button.addEventListener('touchend', hidePassword, { passive: true });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. Buscar en la tabla 'usuarios'
            const { data: user, error } = await supabase
                .from('usuarios')
                .select('*')
                .eq('email', email)
                .single();

            if (error || !user) {
                window.mostrarError('Usuario no encontrado o correo incorrecto.');
                return;
            }

            // 2. Verificar contraseña con bcryptjs
            const passwordCorrecto = dcodeIO.bcrypt.compareSync(password, user.password);

            if (passwordCorrecto) {
                // Guardar en localStorage para mantener sesión
                localStorage.setItem('sessionUser', JSON.stringify({
                    id_usuario: user.id_usuario,
                    email: user.email,
                    nombre: user.nombre,
                    tipo_usuario: user.tipo_usuario
                }));
                window.location.reload();
            } else {
                window.mostrarError('Contraseña incorrecta.');
            }
        });
    </script>
</body>

</html>
