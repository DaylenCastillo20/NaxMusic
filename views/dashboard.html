<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard NaxMusic</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
        /* Layout básico del dashboard */
        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: #111;
            color: white;
            padding: 20px;
        }

        /* CONTENIDO */
        .content {
            flex: 1;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Carousel ajuste */
        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar">

            <div class="logo-section">

                <img src="img/logo.jpeg" alt="NAXMUSIC Logo">



            </div>

            <nav>

                <a href="#" class="active">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </a>

                <a href="#">

                    <i class="fa-solid fa-file-invoice"></i>

                    Cotizaciones

                </a>

                <a href="#">

                    <i class="fa-solid fa-music"></i>

                    Servicios

                </a>

                <a href="#">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Carrito

                </a>

                <a href="#">

                    <i class="fa-solid fa-users"></i>

                    Usuarios

                </a>

            </nav>

            <button class="logout">

                Cerrar sesión

            </button>

        </aside>

        <!-- ================= CONTENIDO ================= -->
        <main class="content">

            <!-- CAROUSEL -->
            <div id="demo" class="carousel slide" data-bs-ride="carousel">

                <!-- indicadores -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                </div>

                <!-- slides -->
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img src="img/eventos/boda.jpeg" alt="boda">
                        <div class="carousel-caption">
                            <h3>Boda</h3>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="img/eventos/fiesta.jpeg" alt="fiesta">
                        <div class="carousel-caption">
                            <h3>Fiesta</h3>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <img src="img/eventos/empresarial.jpeg" alt="empresarial">
                        <div class="carousel-caption">
                            <h3>Empresarial</h3>
                        </div>
                    </div>

                </div>

                <!-- controles -->
                <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>

        </main>

    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
