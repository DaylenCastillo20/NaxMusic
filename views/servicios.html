
<section class="services-shell" id="servicesShell">
    <aside class="services-panel services-filters services-scroll bg-[#111317]/90 backdrop-blur-md border border-white/5 p-5 lg:p-6 shadow-2xl shadow-black/30 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-white/[0.04] [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-red-600/80 hover:[&::-webkit-scrollbar-thumb]:bg-red-500" aria-label="Filtros de servicios">
        <div class="services-filter-title">
            <h2>Filtros</h2>
            <button type="button" id="limpiarFiltros">Limpiar</button>
        </div>

        <div class="filter-block">
            <h3>Rango de precios</h3>
            <div class="price-readout">
                <span>$100</span>
                <strong id="precioActual">$2,000,000</strong>
            </div>
            <input class="price-slider" id="precioMaximo" type="range" min="100" max="2000000" value="2000000" step="100000">
        </div>

        <div class="filter-block">
            <h3>Tipo de servicio</h3>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="categoria" value="Sonido"> Sonido</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="categoria" value="Iluminacion">
                Iluminacion</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="categoria" value="DJ"> DJ</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="categoria" value="Animacion"> Animación</label>
        </div>

        <div class="filter-block">
            <h3>Ideal para</h3>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="ideal" value="Conciertos"> Conciertos</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="ideal" value="Bodas"> Bodas</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="ideal" value="Fiestas"> Fiestas</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="ideal" value="Empresarial"> Empresarial</label>
            <label class="filter-choice"><input class="h-4 w-4 appearance-none rounded border border-white/15 bg-[#1c1f26] checked:border-red-500 checked:bg-red-600 focus:ring-2 focus:ring-red-600/30" type="checkbox" name="ideal" value="Galas"> Galas</label>
        </div>
    </aside>

    <main class="services-main" id="catalogoServicios">
        <div class="services-toolbar">
            <div class="services-tabs" role="tablist" aria-label="Categorias de servicios">
                <button class="services-tab is-active" type="button" data-tab="Todos">Todos</button>
                <button class="services-tab" type="button" data-tab="Sonido">Sonido</button>
                <button class="services-tab" type="button" data-tab="Iluminacion">Iluminacion</button>
                <button class="services-tab" type="button" data-tab="DJ">DJ</button>
                <button class="services-tab" type="button" data-tab="Animacion">Animación</button>
            </div>

            <select class="services-sort" id="ordenServicios" aria-label="Ordenar servicios">
                <option value="popular">Mas populares</option>
                <option value="precio-asc">Precio menor</option>
                <option value="precio-desc">Precio mayor</option>
            </select>
        </div>

        <div class="services-catalog services-scroll [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-white/[0.04] [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-red-600/80 hover:[&::-webkit-scrollbar-thumb]:bg-red-500">
            <div id="contenedor-servicios" class="services-grid grid grid-cols-1 md:grid-cols-2 gap-6 w-full"></div>
        </div>
    </main>

    <aside class="services-panel services-cart bg-[#111317]/90 backdrop-blur-md border border-white/5 p-5 lg:p-6 shadow-2xl shadow-black/30" id="panelCarrito" aria-label="Carrito de servicios">
        <div class="services-cart-header">
            <h2 id="tituloCarrito">Tu carrito (<span id="contadorCarrito">0</span>)</h2>
            <button class="services-cart-edit" type="button" id="vaciarCarrito">Vaciar </button>
        </div>

        <div class="cart-list services-scroll pr-1 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-white/[0.04] [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-red-600/80 hover:[&::-webkit-scrollbar-thumb]:bg-red-500" id="listaCarrito"></div>

        <div class="cart-totals">
            <div class="total-row">
                <span>Subtotal</span>
                <strong id="subtotalCarrito">$0</strong>
            </div>
            <div class="total-row discount">
                <span>Descuento</span>
                <span id="descuentoCarrito">-$0</span>
            </div>
            <div class="total-row grand">
                <span>Total estimado</span>
                <strong id="totalCarrito">$0</strong>
            </div>
        </div>

        <button class="cart-submit opacity-50 cursor-not-allowed transition-all duration-200" type="button" id="irAlCarrito" disabled>
            Solicitar Cotizacion
        </button>
    </aside>
</section>

<script src="controllers/servicio_controller.js"></script>
<script src="js/servicios.js"></script>
