<link rel="stylesheet" href="css/gestion_cotizaciones.css">

<section class="gc-container">
    <header class="gc-header">
        <div class="gc-header-left">
            <button class="gc-menu-btn" type="button" data-sidebar-toggle aria-label="Ocultar o mostrar menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <div class="gc-title-group">
                <h1>Gestión de Cotizaciones</h1>
                <p>Consulta solicitudes, cambia estados y revisa detalles completos desde una sola tabla.</p>
            </div>
        </div>
    </header>

    <main class="gc-main">
        <div class="gc-table-shell">
            <div class="gc-table-toolbar">
                <div>
                    <h2>Cotizaciones</h2>
                    <p>Registros recibidos desde el formulario de evento.</p>
                </div>

                <div class="gc-toolbar-actions">
                    <label class="gc-search" for="gcSearchCotizaciones">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input id="gcSearchCotizaciones" type="search" placeholder="Buscar por ID, cliente o evento">
                    </label>

                    <select class="gc-filter-status" aria-label="Filtrar por estado">
                        <option value="">Todos los estados</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En revisión">En revisión</option>
                        <option value="Aprobada">Aprobada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>
            </div>

            <div class="gc-table-container">
                <table class="gc-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente / Evento</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cotizacionesTableBody">
                        <tr class="gc-empty-row">
                            <td colspan="6">
                                <div class="gc-empty-state">
                                    <div class="gc-empty-icon" aria-hidden="true">
                                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                            <polyline points="14 2 14 8 20 8"></polyline>
                                            <line x1="9" y1="13" x2="15" y2="13"></line>
                                            <line x1="9" y1="17" x2="13" y2="17"></line>
                                        </svg>
                                    </div>
                                    <p>No hay cotizaciones registradas en este momento</p>
                                </div>
                            </td>
                        </tr>

            </div>
