<link rel="stylesheet" href="css/gestion_cotizaciones.css">

<section class="gc-container" id="adminConsole">
    <header class="gc-header">
        <div class="gc-header-left">

            <div class="gc-title-group">
                <h1>Consola Administrativa</h1>
                <p>Gestiona cotizaciones, servicios y usuarios desde una cuadrícula centralizada.</p>
            </div>
        </div>
    </header>

    <main class="gc-main">
        <nav class="gc-tabs" aria-label="Secciones administrativas">
            <button class="gc-tab is-active" type="button" data-admin-tab="cotizaciones">Gestion de
                Cotizaciones</button>
            <button class="gc-tab" type="button" data-admin-tab="servicios">Catalogo de Servicios</button>
            <button class="gc-tab" type="button" data-admin-tab="usuarios">Usuarios Registrados</button>
        </nav>

        <div class="gc-table-shell">
            <div class="gc-table-toolbar">
                <div>
                    <h2 id="adminTableTitle">Gestion de Cotizaciones</h2>
                    <p id="adminTableDescription">Solicitudes recibidas desde el formulario de evento.</p>
                </div>

                <div class="gc-toolbar-actions">
                    <button class="gc-add-service hidden bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl transition-all flex items-center gap-2" type="button" id="addServiceButton" hidden>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 5v14"></path>
                            <path d="M5 12h14"></path>
                        </svg>
                        Agregar Nuevo
                    </button>
                    <div class="gc-toolbar-status" id="adminConsoleStatus" aria-live="polite"></div>
                </div>
            </div>

            <div class="gc-table-container">
                <table class="gc-table" aria-describedby="adminTableDescription">
                    <thead id="adminTableHead"></thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="gc-modal" id="adminModal" aria-hidden="true">
        <div class="gc-modal-backdrop" data-modal-close></div>
        <div class="gc-modal-card" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
            <button class="gc-modal-close" type="button" data-modal-close aria-label="Cerrar modal">x</button>
            <div id="adminModalContent"></div>
        </div>
    </div>
</section>

<script src="controllers/servicio_controller.js"></script>
<script src="js/admin_console.js"></script>
